<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Reuniones Globales</title>
    <meta name="description" content="Planifica tus reuniones internacionales sin complicaciones, respetando los límites de horario.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">
    <div class="glass-card">
        <div class="header">
            <h1>Reloj Mundial</h1>
            <p>Orquestador de Reuniones Internacionales</p>
        </div>

        <form id="meetingForm">
            <!-- Origen -->
            <div class="form-group">
                <label for="originCountry">País de Origen</label>
                <select id="originCountry" class="form-control" required>
                    <option value="" disabled selected>Seleccione el país origen...</option>
                </select>
            </div>

            <div class="form-group hidden" id="originRegionGroup">
                <label for="originRegion">Región/Estado (Origen)</label>
                <select id="originRegion" class="form-control">
                    <option value="" disabled selected>Seleccione la región...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Hora Local (Origen)</label>
                <div class="time-picker-group">
                    <select id="originHour" class="form-control" required>
                        <!-- Rellenado con JS (00 a 23) -->
                    </select>
                    <select id="originMinute" class="form-control" required>
                        <option value="00">00</option>
                        <option value="15">15</option>
                        <option value="30">30</option>
                        <option value="45">45</option>
                    </select>
                </div>
            </div>

            <!-- Destino -->
            <div class="form-group">
                <label for="destCountry">País de Destino</label>
                <select id="destCountry" class="form-control" required>
                    <option value="" disabled selected>Seleccione el país destino...</option>
                </select>
            </div>

            <div class="form-group hidden" id="destRegionGroup">
                <label for="destRegion">Región/Estado (Destino)</label>
                <select id="destRegion" class="form-control">
                    <option value="" disabled selected>Seleccione la región...</option>
                </select>
            </div>

            <button type="submit" class="btn">Planificar Reunión</button>
        </form>

        <div id="resultArea" class="hidden">
            <!-- El resultado se inyectará aquí -->
        </div>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM | Triangulador de Reuniones Multi-Zona</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="crm-interaction-container">
    <div class="glass-panel">
        <div class="header-section">
            <h2>🌍 Triangulador de Reuniones Globales</h2>
        </div>

        <form id="triangulatorForm">
            <!-- Controles Globales -->
            <div style="display: flex; gap: 20px; margin-bottom: 25px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color);">
                <div class="form-group" style="flex: 1;">
                    <label for="meetingDate">Fecha de la Reunión</label>
                    <input type="date" id="meetingDate" class="form-control" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Hora Sugerida (Basada en Actor 1)</label>
                    <div class="time-picker-group">
                        <select id="meetingHour" class="form-control" required></select>
                        <select id="meetingMinute" class="form-control" required>
                            <option value="00">00</option>
                            <option value="15">15</option>
                            <option value="30">30</option>
                            <option value="45">45</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Grilla de 3 Actores -->
            <div class="actors-grid">
                <!-- Actor 1: Partner (Solicitante) -->
                <div class="actor-card" id="card-actor1">
                    <h3>Actor 1: Solicitante (Partner)</h3>
                    <div class="form-group">
                        <label>País</label>
                        <select id="country1" class="form-control country-select" data-actor="1" required>
                            <option value="" disabled selected>Seleccione...</option>
                        </select>
                    </div>
                    <div class="form-group hidden" id="regionGroup1">
                        <label>Región/Estado</label>
                        <select id="region1" class="form-control region-select" data-actor="1">
                            <option value="" disabled selected>Seleccione...</option>
                        </select>
                    </div>
                </div>

                <!-- Actor 2: Central (Nosotros) -->
                <div class="actor-card" id="card-actor2">
                    <h3>Actor 2: Central</h3>
                    <div class="form-group">
                        <label>País</label>
                        <select id="country2" class="form-control country-select" data-actor="2" required>
                            <option value="" disabled selected>Seleccione...</option>
                        </select>
                    </div>
                    <div class="form-group hidden" id="regionGroup2">
                        <label>Región/Estado</label>
                        <select id="region2" class="form-control region-select" data-actor="2">
                            <option value="" disabled selected>Seleccione...</option>
                        </select>
                    </div>
                </div>

                <!-- Actor 3: Cliente/Asistente -->
                <div class="actor-card" id="card-actor3">
                    <h3>Actor 3: Asistente</h3>
                    <div class="form-group">
                        <label>País</label>
                        <select id="country3" class="form-control country-select" data-actor="3" required>
                            <option value="" disabled selected>Seleccione...</option>
                        </select>
                    </div>
                    <div class="form-group hidden" id="regionGroup3">
                        <label>Región/Estado</label>
                        <select id="region3" class="form-control region-select" data-actor="3">
                            <option value="" disabled selected>Seleccione...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="action-bar">
                <button type="submit" class="btn btn-primary">Triangular y Validar Horarios</button>
            </div>
        </form>

        <div id="resultArea" class="triangulation-result hidden">
            <!-- Resultados Dinámicos -->
        </div>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
